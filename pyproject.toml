[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyperf"
version = "1.0.0"
description = "Predict physical performance class and broad-jump distance from body measurements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "pandas", "scikit-learn>=1.3", "matplotlib", "seaborn", "joblib",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
